name: Publish to PyPI

# Runs when a GitHub release is published. Uses PyPI trusted publishing, so no API
# token is stored: configure the publisher once at https://pypi.org/manage/account/publishing/
# (project paperlab-space, workflow publish.yml, environment pypi).
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the package version
        run: |
          version=$(grep -Po '^__version__ = "\K[^"]+' src/paperlab_space/__init__.py)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - run: uv sync
      - run: uv run pytest
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
