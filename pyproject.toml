[project]
name = "paperlab-space"
dynamic = ["version"]
description = "Open-source engine for evaluating LLMs on spreadsheet data and producing paper-ready results."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Kaung Nay Lin Khant" }]
keywords = ["llm", "evaluation", "research", "benchmark", "latex"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openpyxl>=3.1",
    "charset-normalizer>=3.3",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "litellm>=1.50",
    "typer>=0.12",
    "sacrebleu>=2.4",
    "numpy>=1.24",
]

[project.optional-dependencies]
# The CLI is part of the base install; this empty extra keeps
# `pip install 'paperlab-space[cli]'` (from the 0.1.0 docs) working.
cli = []

[project.scripts]
paperlab-space = "paperlab_space.cli:main"

[project.urls]
Homepage = "https://paperlab.space"
Repository = "https://github.com/paperlab-space/paperlab-core"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-openpyxl",
    "types-pyyaml",
    "griffe>=2.3.0",
    "rouge-score>=0.1.2",  # checks our ROUGE against the reference implementation
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/paperlab_space/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = false

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["rouge_score", "rouge_score.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: calls real model providers (deselected by default)"]
addopts = "-m 'not live'"
