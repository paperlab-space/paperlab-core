[project]
name = "paperlab-core"
dynamic = ["version"]
description = "Open-source engine for evaluating LLMs on spreadsheet data and producing paper-ready results."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "PaperLab.space contributors" }]
keywords = ["llm", "evaluation", "research", "benchmark", "latex"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openpyxl>=3.1",
    "charset-normalizer>=3.3",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "litellm>=1.50",
]

[project.optional-dependencies]
cli = ["typer>=0.12"]

[project.urls]
Homepage = "https://paperlab.space"
Repository = "https://github.com/paperlab-space/paperlab-core"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-openpyxl",
    "types-pyyaml",
    "typer>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/paperlab_core/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = false

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: calls real model providers (deselected by default)"]
addopts = "-m 'not live'"
